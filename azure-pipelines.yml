# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool: windows-agent-sonal

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'
- task: tfsec@1
  inputs:
    version: 'v1.26.0'
    dir: '$(System.DefaultWorkingDirectory)\environments\dev'

- task: Gitleaks@3
  inputs:
    scanlocation: '$(System.DefaultWorkingDirectory)\environments\dev'
    configtype: 'default'
    reportformat: 'sarif'


- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(System.DefaultWorkingDirectory)\environments\dev'
    backendServiceArm: 'mujib_b18'
    backendAzureRmResourceGroupName: 'blr-rg'
    backendAzureRmStorageAccountName: 'pipeline18batch'
    backendAzureRmContainerName: 'forb18'
    backendAzureRmKey: 'forb18-state'

- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'validate'
    workingDirectory: '$(System.DefaultWorkingDirectory)\environments\dev'

- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'plan'
    workingDirectory: '$(System.DefaultWorkingDirectory)\environments\dev'
    environmentServiceNameAzureRM: 'mujib_b18'